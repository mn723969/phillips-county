<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Phillips County, Arkansas: Community Data Dashboard</title>
<style>
body{margin:0;background:#FFFFFF}
.viz-root{
  color-scheme:light;
  --brand:#9D2235; --brand-dark:#7A1A29; --tint:#F2F2F4;
  --border:#C7C8C9; --grid:#E3E4E5; --text:#000000; --text2:#464648; --muted:#6B6B6E;
  --sig:#0F3842; --ph:#9D2235; --le:#2A6676; --gold:#F2B705;
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  font-size:17px; line-height:1.5; color:var(--text); background:#FFFFFF;
  max-width:1240px; margin:0 auto; padding:0 16px 32px;
}
.viz-root *{box-sizing:border-box}
.hdr{background:var(--brand);color:#FFF;padding:28px 24px 24px;margin:0 -16px}
.hdr .logo{display:block;height:80px;width:auto;margin:0 0 16px}
.hdr h1{font-size:2.05rem;line-height:1.2;margin:.2rem 0 .4rem;font-weight:750}
.hdr .lede{color:#F2F2F4;max-width:82ch;margin:0}
.tabs{display:flex;gap:4px;overflow-x:auto;background:#464648;margin:0 -16px;padding:8px 16px 0;box-shadow:inset 0 -4px 0 #FFF}
.tab{appearance:none;border:0;background:none;padding:11px 14px 13px;font:inherit;font-size:.96rem;font-weight:650;color:#F2F2F4;cursor:pointer;white-space:nowrap;border-radius:8px 8px 0 0;border-top:4px solid transparent}
.tab:hover{background:rgba(255,255,255,.12);color:#FFF}
.tab[aria-selected="true"]{background:#FFF;color:var(--brand);border-top-color:var(--brand)}
.tab:focus-visible,.btn:focus-visible,select:focus-visible,.hit:focus-visible,path.tr:focus-visible,input:focus-visible{outline:3px solid #3E94AA;outline-offset:2px}
.bar-ctl{position:sticky;top:0;z-index:5;background:#FFF;display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;padding:14px 0 12px;border-bottom:1px solid var(--border)}
.fgroup{display:flex;flex-direction:column;gap:4px}
.flabel{font-size:.76rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
select{font:inherit;font-size:.98rem;padding:8px 34px 8px 12px;min-width:240px;max-width:100%;border:1px solid var(--border);border-radius:8px;background:#FFF;color:var(--text)}
h2.sec{font-size:1.35rem;margin:28px 0 4px}
.intro{max-width:84ch;color:var(--text2);margin:14px 0 6px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,520px),1fr));gap:18px;margin-top:16px}
.grid3{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr));gap:18px;margin-top:16px}
.card{border:1px solid var(--border);border-top:4px solid var(--brand);border-radius:10px;background:#FFF;padding:16px 18px 14px;display:flex;flex-direction:column;min-width:0}
.card.wide{grid-column:1/-1}
.card.hope{border-top-color:var(--gold)}
.card.teal{border-top-color:var(--le)}
.sub{font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;font-weight:700;color:var(--brand)}
.card.hope .sub{color:#8A6500}
.card.teal .sub{color:var(--le)}
.card h3{font-size:1.1rem;margin:.15rem 0 .3rem;line-height:1.3}
.def{font-size:.85rem;color:var(--text2);margin:0 0 8px}
.take{font-size:.93rem;margin:0 0 10px}
.take b{font-variant-numeric:tabular-nums}
.sigtag{color:var(--sig);font-weight:650}
.chart{display:grid;grid-template-columns:var(--lab,150px) minmax(0,1fr) 64px;column-gap:10px;row-gap:5px;align-items:center;position:relative}
.chart .gl{grid-column:2;position:relative;align-self:stretch;pointer-events:none}
.chart .gl i{position:absolute;top:0;bottom:0;width:1px;background:var(--grid)}
.chart .gl i.ref{background:#000;width:2px;opacity:.55}
.rlab{font-size:.88rem;line-height:1.2}
.hit{position:relative;height:22px;display:flex;align-items:center;outline:none;grid-column:2}
.bar{height:14px;border-radius:0 4px 4px 0;min-width:2px}
.ci{position:absolute;height:2px;background:#000;top:50%;transform:translateY(-1px);opacity:.7}
.ci::before,.ci::after{content:"";position:absolute;top:-4px;width:2px;height:10px;background:#000}
.ci::before{left:0}.ci::after{right:0}
@media(max-width:640px){.chart.pg{--lab:112px !important;grid-template-columns:var(--lab) minmax(0,1fr) 48px}.chart.pg .axis span:nth-child(even){display:none}}
.nbpair{grid-column:1/-1;display:grid;grid-template-columns:minmax(340px,10fr) minmax(0,14fr);gap:16px;align-items:start}.nbpair>.card{margin:0;min-width:0}.nbpair .mapc{position:sticky;top:10px}
.nbpair .heat th,.nbpair .heat td{padding:5px 4px;font-size:.78rem;white-space:nowrap}.nbpair .heat td:first-child{white-space:normal;min-width:150px}.nbpair .mapc{padding-left:12px;padding-right:12px}.nbpair .heat th{font-size:.7rem}
.tlab.town{font-size:18px;font-weight:700;font-style:italic;fill:#1A1A1A;stroke-width:4px}
tr.rsel td{box-shadow:inset 0 2px 0 #1A1A1A,inset 0 -2px 0 #1A1A1A}tr.rsel td:first-child{font-weight:700}
@media(max-width:1050px){.nbpair{grid-template-columns:1fr}.nbpair .mapc{position:static}}

/* ---- domain pills ---- */
.dpills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;margin:18px 0 6px}
.dpill{appearance:none;font:inherit;text-align:left;border:1px solid var(--border);border-left:6px solid var(--dc);border-radius:10px;background:#FFF;padding:12px 14px;cursor:pointer;display:flex;flex-direction:column;gap:3px;transition:box-shadow .15s,transform .15s}
.dpill:hover{box-shadow:0 2px 10px rgba(0,0,0,.08)}
.dpill.on{background:var(--dc);color:#FFF;border-color:var(--dc)}
.dpt{font-weight:750;font-size:1.02rem}.dps{font-size:.8rem;opacity:.85}
.dhead{display:flex;flex-wrap:wrap;gap:16px 28px;align-items:flex-end;justify-content:space-between;margin:16px 0 4px;padding:16px 18px;border-radius:12px;background:linear-gradient(90deg,color-mix(in srgb,var(--dc) 10%,#FFF),#FFF)}
.dhead h2{margin:0;font-size:1.35rem;color:var(--dc)}.dhead p{margin:4px 0 0;color:var(--text2);max-width:640px}
.dsum{min-width:280px;flex:0 1 380px}.dsum-t{font-size:.86rem;color:var(--text2);margin-bottom:6px}
.dsum-b{display:flex;height:12px;border-radius:6px;overflow:hidden;background:#EEE}.dsum-b i{display:block;height:100%}
.dsum-b .need,.mt.need .chip,.chip.need{background:#9D2235}.dsum-b .same,.chip.same{background:#8E8E93}.dsum-b .better,.chip.better{background:#2E7D5B}
.mlegend{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;font-size:.8rem;color:var(--text2);margin:10px 0 0}
.mlegend i{display:inline-block;width:18px;height:7px;border-radius:4px;margin-right:6px;vertical-align:1px}.mlegend .lp{background:#9D2235}.mlegend .ls{background:#9A9AA0}
.subh{font-size:.82rem;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin:20px 0 8px;padding-bottom:5px;border-bottom:1px solid var(--grid)}
.tiles2{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,190px),1fr));gap:10px}
.subwrap{display:flex;flex-wrap:wrap;gap:0 22px}.subblk{min-width:min(100%,200px)}
.mt{border:1px solid var(--border);border-radius:10px;background:#FFF;padding:11px 13px 12px;display:flex;flex-direction:column;gap:4px;outline:none;position:relative;border-top:4px solid #8E8E93}
.mt.need{border-top-color:#9D2235}.mt.better{border-top-color:#2E7D5B}.mt.info{border-top-color:#6B4E9B}
.mt:focus-visible{outline:3px solid #3E94AA}
.mt-l{font-size:.86rem;font-weight:650;line-height:1.25;min-height:2.2em}
.mt-v{font-size:1.75rem;font-weight:800;line-height:1.05;font-variant-numeric:tabular-nums;color:#111}
.mt.need .mt-v{color:#8A1C2E}
.mt-b{display:flex;flex-direction:column;gap:3px;margin-top:2px}.mt-b div{height:7px;background:#F0F0F2;border-radius:4px;overflow:hidden}.mt-b i{display:block;height:100%;border-radius:4px}
.mt-b .p{background:#9D2235}.mt.better .mt-b .p{background:#2E7D5B}.mt.same .mt-b .p{background:#6E6E73}.mt-b .s{background:#B9B9BE}
.mt-s{font-size:.8rem;color:var(--text2);font-variant-numeric:tabular-nums}
.chip{display:inline-block;align-self:flex-start;font-size:.72rem;font-weight:700;color:#FFF;border-radius:999px;padding:2px 9px;margin-top:2px}
.mlegend .chip{margin:0}
.callout{margin-top:14px;padding:12px 16px;border-radius:10px;background:var(--tint);border-left:5px solid var(--brand);font-size:.93rem}
/* ---- who and where ---- */
.heat tr.grp td{background:#FAFAFB;font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;font-weight:750;color:var(--text2);padding-top:10px}
.mcell{display:flex;align-items:center;gap:6px;justify-content:space-between}
.pinfo,.pinfo-demo{appearance:none;flex:none;width:19px;height:19px;border-radius:50%;border:1.5px solid var(--brand);color:var(--brand);background:#FFF;font:italic 700 12px/1 Georgia,serif;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.pinfo:hover,.pinfo:focus-visible{background:var(--brand);color:#FFF}
.pinfo-demo{cursor:default;vertical-align:-3px}
.pop{position:absolute;z-index:30;width:min(420px,calc(100% - 16px));background:#FFF;border:1px solid var(--border);border-top:5px solid var(--brand);border-radius:12px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:14px 16px 14px}
.pop h4{margin:2px 0 0;font-size:1.05rem}.pop ul{margin:0;padding-left:18px;font-size:.9rem;display:flex;flex-direction:column;gap:6px}
.pop .x{position:absolute;top:6px;right:8px;border:0;background:none;font-size:1.4rem;cursor:pointer;color:var(--text2)}
@media(max-width:700px){.pop{position:fixed;left:8px!important;right:8px;bottom:8px;top:auto!important;width:auto;max-height:70vh;overflow:auto}.dpills{grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}.dpill{padding:9px 8px;border-left-width:4px}.dps{display:none}.dpt{font-size:.82rem;line-height:1.2}.tiles2{grid-template-columns:1fr 1fr;gap:8px}.mt{padding:9px 10px}.mt-v{font-size:1.35rem}.subblk{flex-basis:100%!important}.dhead{padding:12px}.dsum{min-width:0;flex-basis:100%}}
/* ---- resource directory ---- */
.rtiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,180px),1fr));gap:10px;margin-top:8px}
.rtile{appearance:none;font:inherit;text-align:left;border:1px solid var(--border);border-left:6px solid var(--gc);border-radius:10px;background:#FFF;padding:10px 12px;cursor:pointer;display:flex;flex-direction:column}
.rtile b{font-size:1.6rem;line-height:1.1;color:var(--gc)}.rtile span{font-size:.84rem;color:var(--text2)}
.rtile.on{background:var(--gc)}.rtile.on b,.rtile.on span{color:#FFF}
.rctl{display:flex;flex-wrap:wrap;gap:12px;margin:14px 0 6px;align-items:flex-end}
.rctl input[type=search]{font:inherit;padding:8px 10px;border:1px solid var(--border);border-radius:8px;min-width:240px}
.rdt td{font-size:.88rem;vertical-align:top}.rdscroll{max-height:560px;overflow:auto;border:1px solid var(--border);border-radius:10px}.rdscroll .rdt thead th{position:sticky;top:0;background:#FFF;z-index:1}

/* ---- overview v3 ---- */
.ovtop{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(300px,1fr);gap:22px;align-items:start;margin-top:18px}
.ovq{font-size:1.9rem;line-height:1.15;margin:0;font-weight:800;letter-spacing:-.01em}
.viewbox{background:var(--tint);border-left:5px solid var(--brand);border-radius:10px;padding:14px 16px}
.viewbox select{width:100%;font:inherit;font-weight:650;padding:9px 10px;border:1px solid var(--border);border-radius:8px;background:#FFF;margin:6px 0 10px}
.viewbox p{margin:6px 0 0;font-size:.84rem;color:var(--text2)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchips button,.chipbtn{appearance:none;font:inherit;font-size:.82rem;border:1px solid var(--border);background:#FFF;border-radius:999px;padding:4px 11px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.vchips button i{width:9px;height:9px;border-radius:50%;display:inline-block}
.vchips button.on,.chipbtn.on{background:var(--brand);border-color:var(--brand);color:#FFF}
.dpills.sm{display:flex;flex-wrap:wrap;gap:8px;margin:10px 0 0}
.heros{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:10px;margin-top:20px}
.hero{border:1px solid var(--border);border-radius:10px;background:#FFF;padding:12px 13px;display:flex;flex-direction:column;gap:5px;outline:none}
.hero-l{font-size:.74rem;line-height:1.2;text-transform:uppercase;letter-spacing:.06em;font-weight:700;color:var(--text2);min-height:2.4em}
.hero-v{font-size:2.05rem;font-weight:800;line-height:1;color:#3A3A3C;font-variant-numeric:tabular-nums}.hero.need .hero-v{color:var(--brand)}.hero.better .hero-v{color:#2E7D5B}
.picto{width:100%;max-width:170px;height:auto;display:block}
.hero-s{font-size:.84rem;color:var(--text2)}.hero-a{font-size:.78rem;color:var(--muted);border-top:1px solid var(--grid);padding-top:5px;margin-top:2px}
.hero.need .hero-a b{color:var(--brand)}.hero.better .hero-a b{color:#2E7D5B}
.kfbox{margin-top:18px;background:var(--tint);border-left:6px solid var(--brand);border-radius:10px;padding:14px 20px}
.kfbox h3{margin:0 0 8px;font-size:1.08rem}.kfbox ul{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:.98rem;line-height:1.45}
.cblegend{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:.8rem;color:var(--text2);margin-top:18px}
.cblegend i{display:inline-block;width:18px;height:8px;border-radius:4px;margin-right:6px;vertical-align:0}.cblegend .lp{background:#6E6E73}.cblegend .ls{width:3px;height:12px;background:#000;border-radius:1px;vertical-align:-2px}
.cb{display:grid;grid-template-columns:minmax(120px,1.1fr) minmax(0,1.6fr) 54px;gap:7px 12px;align-items:center;margin-top:6px}
.cb-l{font-size:.9rem;line-height:1.2}.hb{color:#2E7D5B;font-weight:800}
.cb-t{position:relative;height:16px;background:#F0F0F2;border-radius:8px}
.cb-b{position:absolute;left:0;top:0;bottom:0;border-radius:8px;background:#8E8E93}.cb-b.need{background:#9D2235}.cb-b.better{background:#2E7D5B}
.cb-s{position:absolute;top:-4px;bottom:-4px;width:3px;margin-left:-1.5px;background:#000;border-radius:1px}
.cb-v{font-size:.9rem;font-weight:700;text-align:right;font-variant-numeric:tabular-nums}.cb-v.need{color:var(--brand)}
.gc{display:grid;grid-template-columns:minmax(150px,240px) minmax(0,1fr);gap:4px 16px;align-items:center;margin-top:10px}
.gc-l{font-size:.98rem}
.gc-t{position:relative;height:30px}
.gc-t::before{content:"";position:absolute;left:0;right:0;top:50%;border-top:1px solid #EEE}
.gc-r{position:absolute;top:50%;height:6px;margin-top:-3px;background:#C9C9CD;border-radius:3px}
.gc-s{position:absolute;top:3px;bottom:3px;width:2px;background:#000;margin-left:-1px}
.gc-d{position:absolute;top:50%;width:15px;height:15px;margin:-7.5px 0 0 -7.5px;border-radius:50%;border:2px solid #FFF;box-shadow:0 0 0 1px rgba(0,0,0,.08);cursor:pointer;outline:none}
.gc-d:hover,.gc-d:focus-visible{transform:scale(1.35);z-index:2}
.gc-ax{position:relative;height:22px;border-top:1px solid var(--grid);font-size:.78rem;color:var(--muted)}.gc-ax span{position:absolute;top:4px;transform:translateX(-50%)}
.nr td{vertical-align:middle;padding:10px 8px}.nr tr[data-g]{cursor:pointer}.nr tr[data-g]:hover td{background:#FAFAFB}
.nr small{color:var(--muted);font-size:.8rem}
.nr-b{display:flex;align-items:center;gap:10px}.nr-b div{flex:1;height:12px;background:#F0F0F2;border-radius:6px;overflow:hidden}.nr-b i{display:block;height:100%;background:var(--brand);border-radius:6px}
@media(max-width:1100px){.heros{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:800px){.ovtop{grid-template-columns:1fr}.ovq{font-size:1.45rem}.heros{grid-template-columns:repeat(2,minmax(0,1fr))}.gc{grid-template-columns:110px minmax(0,1fr)}.gc-l{font-size:.82rem}.cb{grid-template-columns:110px minmax(0,1fr) 46px}}
.cb-l,.gc-l{display:flex;align-items:center;justify-content:space-between;gap:6px}.popstat{margin:0 0 8px;font-size:.9rem}.tneed{color:var(--brand);font-weight:700}.tbetter{color:#2E7D5B;font-weight:700}#ovpop{z-index:60}
.armk{position:absolute;top:1px;bottom:1px;width:3px;background:#000;transform:translateX(-1px);border-radius:1px}
.val{font-size:.88rem;font-variant-numeric:tabular-nums;white-space:nowrap}
.axis{grid-column:2;position:relative;height:18px;font-size:.76rem;color:var(--muted)}
.axis span{position:absolute;transform:translateX(-50%);top:1px;font-variant-numeric:tabular-nums}
.cnote{font-size:.8rem;color:var(--muted);margin-top:10px}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.84rem;color:var(--text2);margin:2px 0 8px;align-items:center}
.legend span{display:inline-flex;align-items:center;gap:6px}
.sw{width:12px;height:12px;border-radius:3px;display:inline-block;flex:none}
.btn{appearance:none;font:inherit;font-size:.84rem;border:1px solid var(--border);background:#FFF;color:var(--text2);border-radius:6px;padding:5px 11px;cursor:pointer}
.btn:hover{color:var(--text);border-color:var(--muted)}
.btn.on{background:var(--brand);border-color:var(--brand);color:#FFF}
.btn.big{font-size:.95rem;padding:8px 16px;background:var(--brand);border-color:var(--brand);color:#FFF;font-weight:650}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.tip{position:fixed;z-index:50;pointer-events:none;background:#464648;color:#FFF;font-size:.84rem;line-height:1.4;padding:8px 10px;border-radius:8px;max-width:310px;box-shadow:0 4px 14px rgba(0,0,0,.2);display:none}
.tip b{color:#FFF}
.tip .tm{color:#E3E4E5;font-size:.8rem}
/* overview */
.about-band{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));margin:22px 0 6px;padding:6px 0;border-top:1px solid var(--border);border-bottom:1px solid var(--border)}
.about-band div{display:flex;flex-direction:column;align-items:center;text-align:center;padding:10px 8px}
.about-band b{font-size:1.65rem;line-height:1.15;color:var(--brand);font-variant-numeric:tabular-nums}
.about-band span{font-size:.84rem;color:var(--text2)}
table.t{width:100%;border-collapse:collapse;font-size:.9rem;font-variant-numeric:tabular-nums}
table.t th{text-align:left;font-size:.74rem;text-transform:uppercase;letter-spacing:.05em;color:var(--text2);border-bottom:2px solid var(--border);padding:6px 8px}
table.t td{border-bottom:1px solid var(--grid);padding:6px 8px;vertical-align:top}
table.t td.n,table.t th.n{text-align:right}
.up{color:var(--brand-dark);font-weight:650}
.dn{color:var(--le);font-weight:650}
ul.kf{margin:6px 0 0;padding-left:1.15rem}
ul.kf li{margin:0 0 8px}
.pill{display:inline-block;font-size:.74rem;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--tint);color:var(--text2);white-space:nowrap}
.pill.ph{background:#F6E3E6;color:var(--ph)}
.pill.le{background:#E0EEF1;color:var(--le)}
.pill.v{background:#FFF4D1;color:#7A5A00}
/* map: AR-COMPASS Explorer style */
.explorer{position:relative;margin:16px -16px 0;height:clamp(600px,82vh,940px);border-top:1px solid var(--border);border-bottom:1px solid var(--border);display:flex}
.mapcol{position:relative;flex:1;min-width:0;overflow:hidden;background:#F3F3F1}
#msvg{position:absolute;inset:0;width:100%;height:100%;display:block;cursor:grab;touch-action:none;user-select:none}
#msvg.drag{cursor:grabbing}
path.ctx{fill:#E9E9E6;stroke:#FFFFFF;stroke-width:1;vector-effect:non-scaling-stroke}
path.tr{stroke:#FFFFFF;stroke-width:1.2;vector-effect:non-scaling-stroke;cursor:pointer}
path.tr:hover{stroke:#000;stroke-width:2}
path.tr.sel{stroke:#000;stroke-width:3}
path.rd{fill:none;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke;pointer-events:none}path.rd3{stroke:#B4ADA4;stroke-width:.7}path.rd2{stroke:#7D7368;stroke-width:1.5}path.rd1c{stroke:#FFFFFF;stroke-width:4.2}path.rd1{stroke:#4A433D;stroke-width:2.4}
path.cline{fill:none;stroke:#000;stroke-width:2.6;stroke-linejoin:round;vector-effect:non-scaling-stroke;pointer-events:none}
.tlab{font-weight:700;fill:#000;paint-order:stroke;stroke:#FFF;pointer-events:none}
.town{font-weight:600;fill:#2b2b2d;paint-order:stroke;stroke:rgba(255,255,255,.92);pointer-events:none}
.ctyl{font-weight:600;fill:#9a9a9e;letter-spacing:.14em;pointer-events:none;text-transform:uppercase}
.cty{font-weight:800;fill:rgba(0,0,0,.28);letter-spacing:.16em;pointer-events:none;text-transform:uppercase;paint-order:stroke;stroke:rgba(255,255,255,.6)}
.pt{cursor:pointer}
.ring{fill:none;stroke:#0F3842;stroke-dasharray:6 5;opacity:.75;vector-effect:non-scaling-stroke;stroke-width:1.6;pointer-events:none}
.ringlab{font-weight:700;fill:#0F3842;paint-order:stroke;stroke:#FFF;pointer-events:none}
.fl{position:absolute;z-index:4}
.zoombox{top:14px;right:14px;display:flex;gap:8px}
.ibtn{width:42px;height:42px;border-radius:10px;border:1px solid var(--border);background:#FFF;box-shadow:0 2px 8px rgba(0,0,0,.12);font:inherit;font-size:1.35rem;line-height:1;cursor:pointer;color:#222;display:flex;align-items:center;justify-content:center}
.ibtn:hover{background:var(--tint)}
.jump{top:14px;left:14px;display:flex;gap:8px;align-items:center}
.jump select{min-width:260px;box-shadow:0 2px 8px rgba(0,0,0,.12);border-color:#DDD;height:42px}
.panel{flex:none;width:370px;height:100%;overflow:auto;background:#FFF;border-left:1px solid var(--border);padding:16px 18px}
.panel.min{max-height:none;overflow:visible}
.panel .ph{display:flex;align-items:center;justify-content:space-between;gap:8px}
.panel h3{font-size:1.45rem;font-weight:500;margin:0}
.hidebtn{font:inherit;font-size:.82rem;border:1px solid #E1E1E3;background:#FFF;border-radius:8px;padding:5px 10px;cursor:pointer;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.ptabs{display:flex;background:var(--tint);border-radius:9px;padding:3px;margin:12px 0 10px}
.ptabs button{flex:1;appearance:none;border:0;background:none;font:inherit;font-size:.9rem;font-weight:600;padding:7px 6px;border-radius:7px;cursor:pointer;color:var(--text2)}
.ptabs button.on{background:#FFF;color:#000;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.metricsel{width:100%;min-width:0;font-weight:600}
.mcat{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--text2);margin:6px 0 0;text-align:right}
.mdesc{font-size:.85rem;color:var(--text2);text-align:center;margin:10px 0 2px;font-style:italic}
.stbig{text-align:center;margin:6px 0 4px}
.stbig small{display:block;font-size:.85rem;letter-spacing:.06em;text-transform:uppercase;color:#000}
.stbig b{font-size:1.65rem;color:var(--brand)}
.grad{display:grid;grid-template-columns:52px 1fr;gap:10px;align-items:start;margin:8px 0 2px}
.grad .nd{height:12px;border:1px solid #BDBDC0;border-radius:6px;background:#FFF}
.grad .bar4{display:flex;height:12px;border-radius:0 6px 6px 0;overflow:hidden}
.grad .bar4 i{flex:1}
.grad .lbl{position:relative;height:16px;font-size:.74rem;color:#333;font-variant-numeric:tabular-nums}
.grad .lbl span{position:absolute;transform:translateX(-50%)}
.grad .lbl span:first-child{transform:none}
.grad .lbl span:last-child{transform:translateX(-100%)}
.grad .ndl{font-size:.74rem;color:#333;text-align:center}
.mnote{font-size:.78rem;color:var(--muted);margin:8px 0 0}
.sech{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;color:var(--text2);font-weight:700;margin:14px 0 6px}
.tgl{display:flex;align-items:center;gap:10px;font-size:.9rem;padding:5px 0;cursor:pointer}
.tgl input{appearance:none;width:36px;height:20px;border-radius:999px;background:#C7C8C9;position:relative;cursor:pointer;flex:none;margin:0;transition:background .15s}
.tgl input::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:#FFF;transition:left .15s}
.tgl input:checked{background:var(--brand)}
.tgl input:checked::after{left:19px}
.lgrp{border:1px solid #E1E1E3;border-radius:10px;margin:0 0 8px;background:#FFF}
.lgrp.open{border-color:#B9A6DA}
.lgrp>button{width:100%;display:flex;align-items:center;gap:10px;appearance:none;border:0;background:none;font:inherit;font-size:.92rem;font-weight:650;padding:10px 12px;cursor:pointer;text-align:left}
.lgrp>button .gi{width:12px;height:12px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #FFF,0 0 0 3px rgba(0,0,0,.15)}
.lgrp>button .gc{margin-left:auto;font-size:.76rem;font-weight:500;color:var(--muted);white-space:nowrap}
.lgrp>button .car{font-size:.7rem;color:var(--muted);transition:transform .15s}
.lgrp.open>button .car{transform:rotate(180deg)}
.lgrp .lbody{display:none;padding:0 12px 10px}
.lgrp.open .lbody{display:block}
.layer{display:flex;align-items:center;gap:9px;font-size:.87rem;padding:4px 0;cursor:pointer}
.layer input{margin:0;width:17px;height:17px;accent-color:var(--brand);flex:none}
.layer .ct{margin-left:auto;color:var(--muted);font-variant-numeric:tabular-nums;font-size:.8rem}
.lgall{font-size:.78rem;color:var(--brand);background:none;border:0;padding:2px 0 6px;cursor:pointer;font:inherit;font-size:.78rem;text-decoration:underline}
.ws{top:68px;left:14px;width:340px;max-height:calc(100% - 82px);overflow:auto;background:rgba(255,255,255,.97);border:1px solid #E1E1E3;border-radius:14px;box-shadow:0 6px 24px rgba(0,0,0,.14);padding:14px 16px}
.ws .x{float:right;font:inherit;font-size:.8rem;border:1px solid #E1E1E3;background:#FFF;border-radius:8px;padding:3px 9px;cursor:pointer}
.ws h4{margin:2px 0 2px;font-size:1.15rem}
.ws dl{display:grid;grid-template-columns:1fr auto auto;gap:3px 10px;margin:8px 0 0;font-size:.85rem}
.ws dt{color:var(--text2)} .ws dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.panel.showpanel{position:absolute;top:68px;right:14px;width:auto;height:auto;border:0;padding:0;background:none;z-index:4}
.attr{position:absolute;right:10px;bottom:6px;font-size:.7rem;color:#77777b;z-index:3}
@media (max-width:1050px){.panel{width:300px;padding:14px}}
@media (max-width:640px){
 .explorer{height:auto;overflow:visible;background:none;border:0}
 #msvg{position:relative;height:62vh;background:#F3F3F1;border:1px solid var(--border);border-radius:10px}
 .explorer{flex-direction:column}
 .mapcol{overflow:visible;background:none}
 .panel{width:auto;height:auto;border-left:0;border-top:1px solid var(--border)}
 .fl.ws{position:static;width:auto;max-height:none;margin:12px 16px}
 .zoombox{top:14px;right:14px}
 .jump select{min-width:0;width:calc(100vw - 200px)}
 .attr{display:none}
}
/* tables */
.hgrp{background:var(--tint);font-weight:700;font-size:.74rem;text-transform:uppercase;letter-spacing:.06em;color:var(--text2)}
.lnk{appearance:none;background:none;border:0;padding:0;font:inherit;color:#000;cursor:pointer;text-align:left;text-decoration:underline dotted #999;text-underline-offset:3px}
.lnk:hover{color:var(--brand)}
table.heat td.hc{min-width:66px;border-bottom:1px solid #FFF;border-left:1px solid #FFF}
.donuts{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px 14px;margin-top:12px}
@media (max-width:900px){.donuts{grid-template-columns:repeat(2,minmax(0,1fr))}}
.dn1{display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;background:var(--tint);border-radius:10px;padding:16px 12px}
.dn1 span{font-size:.95rem;color:var(--text2);line-height:1.3}
.dn1 small{font-size:.86rem;color:var(--muted)}
.dn1 .dtx{height:104px;display:flex;align-items:center}
.ystar{color:#F2B705;text-shadow:0 0 1px #000,0 0 1px #000;font-size:1.1em}
blockquote.sq{margin:12px 0 0;padding:4px 0 4px 14px;border-left:4px solid var(--gold);font-size:1.08rem;line-height:1.45;color:#222}
.vph{max-height:440px}
a.btn{text-decoration:none;display:inline-block}
/* hope */
.svc{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.25fr);gap:0;border-top:1px solid var(--grid)}
.svc>div{padding:10px 10px 10px 0;border-bottom:1px solid var(--grid)}
.svc .s{font-weight:650}
.svc .s small{display:block;font-weight:400;color:var(--muted);font-size:.8rem}
.svc .n{font-size:.92rem;color:var(--text2)}
.svc .n b{color:var(--text)}
.voice{border:2px dashed var(--border);border-radius:10px;padding:18px;color:var(--muted);background:#FAFAFB;min-height:150px;display:flex;flex-direction:column;justify-content:center;gap:6px}
.vph{width:100%;aspect-ratio:16/9;background:repeating-linear-gradient(45deg,#EFEFF1 0 10px,#F7F7F8 10px 20px);border-radius:6px;display:flex;align-items:center;justify-content:center;font-size:.85rem}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:8px}
.tile{background:var(--tint);border-radius:8px;padding:10px 12px}
.tile b{display:block;font-size:1.5rem;line-height:1.1;color:#000;font-variant-numeric:tabular-nums}
.tile span{font-size:.82rem;color:var(--text2)}
.gap{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid var(--grid);font-size:.9rem}
.gap .z{font-weight:750;color:var(--brand-dark);white-space:nowrap}
.ftr{margin-top:34px;padding-top:14px;border-top:1px solid var(--border);font-size:.8rem;color:var(--muted)}
.methods h3{font-size:1.05rem;margin:18px 0 4px}
.methods p,.methods li{max-width:90ch;color:var(--text2);font-size:.93rem}
a{color:var(--brand)}
@media print{.tabs,.bar-ctl{display:none}}
</style>
</head>

function patternText(k){const I=IND[k],s=sval(k),hi=I.worse!=='low';
  const rows=PT.map(g=>({g,v:val(T[g],k)[0]})).sort((a,b)=>b.v-a.v);const top=rows[0],bot=rows[rows.length-1];
  const worst=hi?top:bot,best=hi?bot:top;const need=r=>s!=null&&(hi?r.v>s:r.v<s);const nN=rows.filter(need).length;
  const town=rows.filter(r=>HMTOWN.includes(T[r.g].label)),rur=rows.filter(r=>!HMTOWN.includes(T[r.g].label));
  const mean=a=>a.reduce((x,y)=>x+y.v,0)/a.length;const mt=mean(town),mr=mean(rur);const rel=(mt-mr)/Math.max(1e-9,(mt+mr)/2);
  const townWorse=hi?rel>0:rel<0;
  const out=[];
  out.push(`<b>Range.</b> ${esc(I.label)} goes from <b>${F(k,bot.v)}</b> in ${esc(tName2(bot.g))} to <b>${F(k,top.v)}</b> in ${esc(tName2(top.g))}.`);
  if(s!=null)out.push(`<b>Compared with Arkansas (${F(k,s)}).</b> `+(nN===PT.length?`All seven neighborhoods show higher need than the state.`:nN===0?`Every neighborhood is at or better than the state level.`:`${nN} of 7 neighborhoods show higher need than the state.`));
  out.push(`<b>Town and country.</b> `+(Math.abs(rel)<.08?`Helena&ndash;West Helena neighborhoods and the rural parts of the county look about the same on this measure.`:townWorse?`Need is higher in the Helena&ndash;West Helena neighborhoods than in the rural parts of the county (Marvell, Lexa, Elaine and Lake View areas).`:`Need is higher in the rural parts of the county (Marvell, Lexa, Elaine and Lake View areas) than in Helena&ndash;West Helena.`));
  if(I.unit!=='$'&&best.v>0){const r=hi?worst.v/best.v:best.v/worst.v;if(r>=1.4)out.push(`<b>Gap.</b> The neighborhood with the most need has about <b>${r.toFixed(1)} times</b> the ${hi?'rate':'level'} of the one with the least.`);}
  else if(I.unit==='$')out.push(`<b>Gap.</b> Median income in ${esc(T[best.g].label)} is about <b>${(best.v/worst.v).toFixed(1)} times</b> that of ${esc(T[worst.g].label)}.`);
  return out;}

function delta(){const list=STORIES.filter(x=>x&&(x.name||x.quote||x.video));
  const shown=list.filter(x=>DS.theme==='All'||x.theme===DS.theme);const feat=shown.find(x=>x.featured)||null;const rest=shown.filter(x=>x!==feat);
  const ph=n=>Array.from({length:n},(_,i)=>`<div class="voice"><div class="vph">&#9654;&nbsp; Interview ${i+1}</div><div style="font-style:italic">&ldquo;A quote from the interview will go here.&rdquo;</div><div style="font-size:.85rem">Name &middot; role &middot; community</div></div>`).join('');
  $('#view').innerHTML=`<p class="intro">Numbers tell part of the story. The people of Phillips County tell the rest. This section shares documentary interviews and video of residents, families and community leaders, in their own words.</p>
  ${list.length?`<div class="seg" id="thSeg" style="margin:14px 0 4px">${STHEMES.map(t=>`<button class="btn ${t===DS.theme?'on':''}" data-t="${t}">${t}</button>`).join('')}</div>`:''}
  <div class="grid">
   ${list.length?(feat?storyCard(feat,true):'')+rest.map(x=>storyCard(x,false)).join('')+(shown.length?'':'<p class="intro">No stories on this theme yet.</p>'):
   `<div class="card hope wide"><div class="sub">Featured story</div><div class="voice" style="min-height:0;padding:12px"><div class="vph" style="font-size:1.05rem">&#9654;&nbsp; Featured video coming soon</div></div>
     <h3 style="margin-top:12px">Stories from Phillips County</h3><p class="def">Interviews are being filmed now. They will appear here as they are finished.</p></div>
    <div class="grid3" style="grid-column:1/-1;margin-top:0">${ph(6)}</div>`}
  </div>`;
  const ts=$('#thSeg');if(ts)ts.onclick=e=>{const b=e.target.closest('[data-t]');if(!b)return;DS.theme=b.dataset.t;delta();};}

/* ---------- ABOUT ---------- */
function about(){$('#view').innerHTML=`<div class="methods">
 <h2 class="sec">About the data</h2>
 <p>This dashboard was prepared by the Arkansas Health Equity and Access Lab (HEAL) at the University of Arkansas for the Arkansas Foodbank&rsquo;s Delta Community Resource Center project. It uses the same data files as the AR-COMPASS Health Explorer.</p>
 <h3>Sources</h3><ul>
  <li><b>Arkansas Health Survey (AHS)</b>: food insecurity, chronic conditions, mental health, financial strain and access to care. County and tract values are model-based small-area estimates with 95% confidence intervals (AR-COMPASS v1). Statewide values are the AHS statewide estimates.</li>
  <li><b>American Community Survey (ACS) 2020&ndash;2024 5-year estimates</b>: population, income, poverty, unemployment, SNAP, household composition, disability, internet, housing cost burden and vehicle access.</li>
  <li><b>United For ALICE</b>, 2024 data year: households below the ALICE threshold (poverty plus ALICE). County only; no margins of error.</li>
  <li><b>CDC PLACES / BRFSS 2022</b>: tooth loss (65+) and dental visits.</li>
  <li><b>FCC Broadband Data Collection</b>, availability as of December 2025: locations without reliable 100/20 Mbps service.</li>
  <li><b>FEMA National Risk Index</b>, December 2025: tract natural hazard risk (national percentile).</li>
  <li><b>HRSA</b>: Health Professional Shortage Areas and Medically Underserved Areas.</li>
  <li><b>HEAL resource inventories</b>: geocoded food access sites, health care facilities and providers, and community support services (compiled 2026).</li>
  <li><b>Census TIGER/Line 2020</b> tract boundaries; FORHP rural designations.</li>
</ul>
 <h3>How to read the numbers</h3><ul>
  <li><b>Map colors</b> compare each tract with Arkansas: the gap relative to the state value (for example, 36% vs 29% is a 24% gap). For measures where higher is better (insurance, internet), the scale is flipped so red always means more need. Measures without a state benchmark (household income, hazard risk) rank the 11 tracts against each other.</li>
  <li><b>Confidence intervals.</b> County and tract AHS estimates are uncertain. At the county level most differences from Arkansas fall within the margin of error; the map and tract views show each estimate&rsquo;s confidence interval on hover. Patterns across several related measures are more reliable than any single number.</li>
  <li><b>Roads</b>: U.S. Census Bureau TIGER/Line 2024 road files for Phillips and Lee counties, simplified for display. Highways are always shown; local streets appear when you zoom in on the Resource map.</li>
  <li><b>Overview comparisons</b>: each box compares Phillips County with Arkansas. For survey-based measures (Arkansas Health Survey), &ldquo;Similar&rdquo; means the two 95% confidence intervals overlap. For Census and other measures, &ldquo;Similar&rdquo; means within 5% of the Arkansas value.</li>
  <li><b>Who and where</b>: the &ldquo;i&rdquo; pattern notes are generated from the tract values shown. &ldquo;Town&rdquo; means the four Helena&ndash;West Helena tracts (4801, 4803, 4804, 4805); &ldquo;rural&rdquo; means tracts 4802.01, 4802.02 and 4806.</li>
  <li><b>Group charts (Overview)</b>: Phillips County estimates by race, age, work and education come from the Census Bureau&rsquo;s American Community Survey 5-year estimates, 2020&ndash;2024 (table S1701 for poverty, S1810 for disability), with published margins of error. The Arkansas comparison for each group is the sum of all 75 Arkansas counties.</li>
  <li><b>Statewide ACS benchmarks</b> are the population-weighted average of Arkansas&rsquo;s 823 tract values, a close approximation of the published state figures. The Arkansas household income figure ($60,773) is the statewide ACS value provided by the HEAL team.</li>
  <li><b>Distances</b> are straight-line miles from 306 Perry Street, not driving distance.</li></ul>
 <h3>Limitations</h3><ul>
  <li><b>Lee County Tract 4701</b> includes a state correctional facility; about 63% of residents live in group quarters, which affects its ACS demographics.</li>
  <li>These are descriptive patterns and do not show cause and effect.</li></ul>
 <h3>Suggested citation</h3><p>Arkansas Health Equity and Access Lab. <i>Phillips County, Arkansas: Community Data Dashboard.</i> University of Arkansas; 2026.</p>
 <h3>Contact</h3><p>Dr. Michael Ni&ntilde;o, Director, Arkansas Health Equity and Access Lab &middot; <a href="mailto:mnino@uark.edu">mnino@uark.edu</a></p></div>`;}

tabs();overview();
</script>
